<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STM32+HC-05 蓝牙水质检测系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 { color: #333; font-size: 28px; margin-bottom: 10px; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .connection-status { display: flex; align-items: center; gap: 10px; }
        .status-indicator {
            width: 12px; height: 12px; border-radius: 50%; background: #dc3545;
        }
        .status-indicator.connected { background: #28a745; }
        .btn {
            padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: 600; transition: all 0.3s ease;
            margin-right: 10px;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; transform: translateY(-2px); }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; transform: translateY(-2px); }
        .btn-success { background: #28a745; color: white; }
        .data-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }
        .card-icon { font-size: 42px; margin-bottom: 15px; }
        .card-title { color: #666; font-size: 16px; margin-bottom: 10px; }
        .card-value { font-size: 48px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .card-unit { color: #999; font-size: 14px; }
        .card.alert { border: 3px solid #dc3545; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(220, 53, 69, 0.3); }
            50% { box-shadow: 0 10px 50px rgba(220, 53, 69, 0.6); }
        }
        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        .chart-container h3 { margin-bottom: 20px; color: #333; }
        .canvas-wrapper { position: relative; height: 300px; }
        .log-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .log-container h3 { margin-bottom: 15px; color: #333; }
        .log-list {
            max-height: 200px; overflow-y: auto; background: #f8f9fa;
            padding: 15px; border-radius: 8px;
        }
        .log-item { padding: 8px; border-bottom: 1px solid #e9ecef; font-size: 14px; }
        .log-item:last-child { border-bottom: none; }
        .log-time { color: #999; font-size: 12px; }
        .config-panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        .config-panel h3 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        .form-group input {
            width: 100%; padding: 10px; border: 2px solid #e9ecef; border-radius: 8px;
            font-size: 14px; transition: border-color 0.3s ease;
        }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .no-data-message {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: rgba(255,255,255,0.95);
            border-radius: 10px; z-index: 10; opacity: 1; transition: opacity 0.3s ease;
        }
        .no-data-message.hidden { opacity: 0; pointer-events: none; }
        .no-data-icon { font-size: 64px; margin-bottom: 15px; opacity: 0.5; }
        .no-data-text { font-size: 24px; font-weight: 600; color: #666; margin-bottom: 10px; }
        .no-data-subtext { font-size: 14px; color: #999; }
        @media (max-width: 768px) {
            .data-cards { grid-template-columns: 1fr; }
            .status-bar { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔵 STM32+HC-05 蓝牙水质检测系统</h1>
            <p style="color: #666;">实时监控水质参数</p>
        </div>

        <div class="status-bar">
            <div class="connection-status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">未连接</span>
            </div>
            <div>
                <button class="btn btn-primary" onclick="connectBluetooth()">连接蓝牙</button>
                <button class="btn btn-danger" onclick="disconnectBluetooth()">断开连接</button>
                <button class="btn btn-success" onclick="clearLogs()">清空日志</button>
            </div>
        </div>

        <div class="config-panel">
            <h3>⚙️ 蓝牙配置说明</h3>
            <div class="form-group">
                <label>说明</label>
                <p style="color: #666; font-size: 13px;">
                    • 使用Web Bluetooth API连接HC-05蓝牙模块<br>
                    • 请使用Chrome或Edge浏览器<br>
                    • 数据格式：{"temperature": 25.5, "ph": 7.2, "turbidity": 2.5}<br>
                    • 需要HTTPS环境或localhost
                </p>
            </div>
        </div>

        <div class="data-cards">
            <div class="card" id="tempCard">
                <div class="card-icon">🌡️</div>
                <div class="card-title">温度</div>
                <div class="card-value" id="tempValue">--</div>
                <div class="card-unit">°C</div>
            </div>

            <div class="card" id="phCard">
                <div class="card-icon">🧪</div>
                <div class="card-title">pH 值</div>
                <div class="card-value" id="phValue">--</div>
                <div class="card-unit">pH</div>
            </div>

            <div class="card" id="turbidityCard">
                <div class="card-icon">📊</div>
                <div class="card-title">浊度</div>
                <div class="card-value" id="turbidityValue">--</div>
                <div class="card-unit">NTU</div>
            </div>
        </div>

        <div class="chart-container">
            <h3>📈 实时趋势图</h3>
            <div class="canvas-wrapper">
                <canvas id="dataChart"></canvas>
                <div class="no-data-message" id="noDataMessage">
                    <div class="no-data-icon">🔵</div>
                    <div class="no-data-text">未连接蓝牙设备</div>
                    <div class="no-data-subtext">请点击"连接蓝牙"按钮开始接收数据</div>
                </div>
            </div>
        </div>

        <div class="log-container">
            <h3>📋 系统日志</h3>
            <div class="log-list" id="logList"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // ========== 全局变量 ==========
        let bluetoothDevice = null;
        let server = null;
        let service = null;
        let characteristic = null;
        let chart = null;
        let dataHistory = [];
        const maxDataPoints = 50;
        let isConnected = false;
        let notificationRegistered = false;

        // 蓝牙SPP服务UUID（HC-05常用）
        const SPP_SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
        const SPP_CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

        // ========== Chart.js 初始化 ==========
        function initChart() {
            const ctx = document.getElementById('dataChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '温度 (°C)',
                            data: [],
                            borderColor: '#ff6384',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            tension: 0.4,
                            yAxisID: 'y'
                        },
                        {
                            label: 'pH 值',
                            data: [],
                            borderColor: '#36a2eb',
                            backgroundColor: 'rgba(54, 162, 235, 0.1)',
                            tension: 0.4,
                            yAxisID: 'y1'
                        },
                        {
                            label: '浊度 (NTU)',
                            data: [],
                            borderColor: '#4bc0c0',
                            backgroundColor: 'rgba(75, 192, 192, 0.1)',
                            tension: 0.4,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 0 },
                    scales: {
                        y: {
                            type: 'linear', display: true, position: 'left',
                            min: 0, max: 100,
                            title: { display: true, text: '温度范围' }
                        },
                        y1: {
                            type: 'linear', display: true, position: 'right',
                            min: 0, max: 20,
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: 'pH/浊度范围' }
                        }
                    },
                    plugins: { legend: { position: 'top' } }
                }
            });
        }

        // ========== 日志管理 ==========
        function addLog(message, type = 'info') {
            const logList = document.getElementById('logList');
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.className = 'log-item';

            let color = '#333';
            if (type === 'success') color = '#28a745';
            else if (type === 'error') color = '#dc3545';
            else if (type === 'warning') color = '#ffc107';

            logItem.innerHTML = `<span class="log-time">[${timeString}]</span> <span style="color:${color}">${message}</span>`;
            logList.insertBefore(logItem, logList.firstChild);

            while (logList.children.length > 100) {
                logList.removeChild(logList.lastChild);
            }
        }

        function clearLogs() {
            document.getElementById('logList').innerHTML = '';
            addLog('日志已清空', 'info');
        }

        // ========== 状态更新 ==========
        function updateStatus(connected) {
            isConnected = connected;
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');

            updateChartVisibility(connected);

            if (connected) {
                indicator.classList.add('connected');
                statusText.textContent = '已连接';
                addLog('成功连接到HC-05蓝牙模块', 'success');
            } else {
                indicator.classList.remove('connected');
                statusText.textContent = '未连接';
                addLog('已断开连接', 'warning');

                // 清空显示数据
                document.getElementById('tempValue').textContent = '--';
                document.getElementById('phValue').textContent = '--';
                document.getElementById('turbidityValue').textContent = '--';

                // 移除可能存在的警告样式
                document.querySelectorAll('.card').forEach(card => {
                    card.classList.remove('alert');
                });
            }
        }

        function updateChartVisibility(connected) {
            const noDataMessage = document.getElementById('noDataMessage');
            const dataChart = document.getElementById('dataChart');

            if (connected) {
                noDataMessage.classList.add('hidden');
                dataChart.style.opacity = '1';
            } else {
                noDataMessage.classList.remove('hidden');
                dataChart.style.opacity = '0.3';
            }
        }

        // ========== Web Bluetooth API 核心功能 ==========

        // 1. 检查浏览器支持
        function checkBluetoothSupport() {
            if (!navigator.bluetooth) {
                addLog('您的浏览器不支持 Web Bluetooth API', 'error');
                addLog('请使用 Chrome 56+ 或 Edge 79+', 'warning');
                alert('您的浏览器不支持 Web Bluetooth API！\n请使用 Chrome 56+ 或 Edge 79+ 浏览器。');
                return false;
            }
            return true;
        }

        // 2. 扫描并连接蓝牙设备
        async function connectBluetooth() {
            if (!checkBluetoothSupport()) return;

            if (isConnected) {
                addLog('设备已连接，请先断开', 'warning');
                return;
            }

            try {
                addLog('正在扫描蓝牙设备...', 'info');

                // 扫描设备（不指定特定UUID，以支持更多设备）
                const options = {
                    acceptAllDevices: true,
                    optionalServices: [SPP_SERVICE_UUID]
                };

                // 如果需要特定设备名称，可以取消注释以下代码
                // options.filters = [{ name: 'HC-05' }];

                bluetoothDevice = await navigator.bluetooth.requestDevice(options);

                addLog(`找到设备: ${bluetoothDevice.name || '未知设备'}`, 'success');
                addLog(`设备ID: ${bluetoothDevice.id}`, 'info');

                // 监听设备断开事件
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                addLog('正在连接 GATT 服务器...', 'info');
                server = await bluetoothDevice.gatt.connect();
                addLog('GATT 服务器连接成功', 'success');

                // 获取服务
                addLog('正在获取服务...', 'info');
                service = await server.getPrimaryService(SPP_SERVICE_UUID);
                addLog(`服务获取成功: ${SPP_SERVICE_UUID}`, 'success');

                // 获取特征值
                addLog('正在获取特征值...', 'info');
                characteristic = await service.getCharacteristic(SPP_CHARACTERISTIC_UUID);
                addLog(`特征值获取成功: ${SPP_CHARACTERISTIC_UUID}`, 'success');

                // 启动通知
                await startNotifications();

                updateStatus(true);

            } catch (error) {
                addLog(`连接失败: ${error.message}`, 'error');
                console.error('连接错误:', error);
                updateStatus(false);
            }
        }

        // 3. 启动通知接收
        async function startNotifications() {
            try {
                addLog('正在订阅数据通知...', 'info');
                await characteristic.startNotifications();
                addLog('数据通知订阅成功', 'success');

                // 监听特征值变化
                characteristic.addEventListener('characteristicvaluechanged', handleDataReceived);
                notificationRegistered = true;

            } catch (error) {
                addLog(`订阅通知失败: ${error.message}`, 'error');
                throw error;
            }
        }

        // 4. 停止通知接收
        async function stopNotifications() {
            if (characteristic && notificationRegistered) {
                try {
                    await characteristic.stopNotifications();
                    characteristic.removeEventListener('characteristicvaluechanged', handleDataReceived);
                    notificationRegistered = false;
                    addLog('已停止数据通知', 'info');
                } catch (error) {
                    addLog(`停止通知失败: ${error.message}`, 'error');
                }
            }
        }

        // 5. 发送数据到设备（可选）
        async function sendCommand(command) {
            if (!characteristic || !isConnected) {
                addLog('设备未连接，无法发送命令', 'error');
                return false;
            }

            try {
                // 支持多种数据格式
                const encoder = new TextEncoder();
                const data = encoder.encode(command + '\n');

                await characteristic.writeValue(data);
                addLog(`发送命令: ${command}`, 'success');
                return true;
            } catch (error) {
                addLog(`发送命令失败: ${error.message}`, 'error');
                return false;
            }
        }

        // 6. 接收数据并解析
        function handleDataReceived(event) {
            const value = event.target.value;

            // 解码数据
            const decoder = new TextDecoder();
            const textData = decoder.decode(value);

            addLog(`收到原始数据: ${textData}`, 'info');

            // 尝试解析数据
            try {
                // 方式1: JSON格式
                if (textData.trim().startsWith('{')) {
                    const jsonData = JSON.parse(textData);
                    processJsonData(jsonData);
                }
                // 方式2: 自定义文本格式 "T:25.5,P:7.2,N:2.5"
                else if (textData.includes('T:') || textData.includes('P:')) {
                    processTextData(textData);
                }
            } catch (error) {
                addLog(`数据解析失败: ${error.message}`, 'error');
            }
        }

        // 7. 处理JSON格式数据
        function processJsonData(data) {
            if (data.temperature !== undefined || data.temp !== undefined) {
                updateDisplay('temperature', data.temperature || data.temp);
            }
            if (data.ph !== undefined) {
                updateDisplay('ph', data.ph);
            }
            if (data.turbidity !== undefined || data.ntu !== undefined) {
                updateDisplay('turbidity', data.turbidity || data.ntu);
            }
            updateChartData(data);
        }

        // 8. 处理文本格式数据
        function processTextData(text) {
            const parts = text.split(',');
            let data = {};

            parts.forEach(part => {
                if (part.startsWith('T:')) {
                    data.temperature = parseFloat(part.substring(2));
                } else if (part.startsWith('P:')) {
                    data.ph = parseFloat(part.substring(2));
                } else if (part.startsWith('N:')) {
                    data.turbidity = parseFloat(part.substring(2));
                }
            });

            if (data.temperature !== undefined) updateDisplay('temperature', data.temperature);
            if (data.ph !== undefined) updateDisplay('ph', data.ph);
            if (data.turbidity !== undefined) updateDisplay('turbidity', data.turbidity);
            updateChartData(data);
        }

        // 9. 更新显示
        function updateDisplay(param, value) {
            const elementId = param + 'Value';
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = value.toFixed(2);
            }
        }

        // 10. 更新图表
        function updateChartData(data) {
            const now = new Date().toLocaleTimeString();
            if (dataHistory.length >= maxDataPoints) dataHistory.shift();

            dataHistory.push({
                time: now,
                temperature: data.temperature || 0,
                ph: data.ph || 0,
                turbidity: data.turbidity || 0
            });

            chart.data.labels = dataHistory.map(d => d.time);
            chart.data.datasets[0].data = dataHistory.map(d => d.temperature);
            chart.data.datasets[1].data = dataHistory.map(d => d.ph);
            chart.data.datasets[2].data = dataHistory.map(d => d.turbidity);
            chart.update('none');

            // 检查阈值
            checkThresholds(data);
        }

        // 11. 阈值检查
        function checkThresholds(data) {
            const thresholds = {
                temperature: { min: 0, max: 50, unit: '°C' },
                ph: { min: 0, max: 14, unit: 'pH' },
                turbidity: { min: 0, max: 100, unit: 'NTU' }
            };

            for (const [param, threshold] of Object.entries(thresholds)) {
                const value = data[param];
                if (value !== undefined && (value < threshold.min || value > threshold.max)) {
                    const card = document.getElementById(param + 'Card');
                    card.classList.add('alert');
                    addLog(`⚠️ ${param} 异常：${value}${threshold.unit}`, 'warning');
                } else {
                    const card = document.getElementById(param + 'Card');
                    card.classList.remove('alert');
                }
            }
        }

        // 12. 断开连接
        async function disconnectBluetooth() {
            if (!isConnected) {
                addLog('设备未连接', 'warning');
                return;
            }

            try {
                // 停止通知
                await stopNotifications();

                // 断开GATT连接
                if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                    bluetoothDevice.gatt.disconnect();
                }

                addLog('主动断开连接', 'info');
                updateStatus(false);

            } catch (error) {
                addLog(`断开连接失败: ${error.message}`, 'error');
            }
        }

        // 13. 设备断开事件处理
        function onDisconnected() {
            addLog('设备已断开连接', 'warning');
            updateStatus(false);
            notificationRegistered = false;
        }

        // ========== 页面初始化 ==========
        window.addEventListener('DOMContentLoaded', function() {
            initChart();
            addLog('系统启动完成', 'info');
            addLog('准备连接蓝牙设备', 'info');
            updateChartVisibility(false);

            // 检查蓝牙支持
            if (checkBluetoothSupport()) {
                addLog('浏览器支持 Web Bluetooth API', 'success');
            }
        });

        // ========== 页面卸载时清理 ==========
        window.addEventListener('beforeunload', function() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
        });
    </script>
</body>
</html>
