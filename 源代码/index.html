 <!DOCTYPE html>
  <html lang="zh-CN">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>STM32+ESP8266 水质检测系统</title>
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body {
              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
              background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
              min-height: 100vh;
              padding: 20px;
          }
          .container { max-width: 900px; margin: 0 auto; }
          .header {
              background: white;
              padding: 20px;
              border-radius: 15px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.2);
              margin-bottom: 20px;
              text-align: center;
          }
          .header h1 { color: #333; font-size: 28px; margin-bottom: 10px; }
          .status-bar {
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 15px 20px;
              background: #f8f9fa;
              border-radius: 10px;
              margin-bottom: 20px;
          }
          .connection-status { display: flex; align-items: center; gap: 10px; }
          .status-indicator {
              width: 12px; height: 12px; border-radius: 50%; background: #dc3545;
          }
          .status-indicator.connected { background: #28a745; }
          .btn {
              padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
              font-size: 14px; font-weight: 600; transition: all 0.3s ease;
          }
          .btn-primary { background: #667eea; color: white; }
          .btn-primary:hover { background: #5a6fd6; transform: translateY(-2px); }
          .data-cards {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
              gap: 20px;
              margin-bottom: 20px;
          }
          .card {
              background: white;
              padding: 25px;
              border-radius: 15px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.15);
              text-align: center;
              transition: transform 0.3s ease;
          }
          .card:hover { transform: translateY(-5px); }
          .card-icon { font-size: 42px; margin-bottom: 15px; }
          .card-title { color: #666; font-size: 16px; margin-bottom: 10px; }
          .card-value { font-size: 48px; font-weight: bold; color: #333; margin-bottom: 5px; }
          .card-unit { color: #999; font-size: 14px; }
          .card.alert { border: 3px solid #dc3545; animation: pulse 1s infinite; }
          @keyframes pulse {
              0%, 100% { box-shadow: 0 10px 30px rgba(220, 53, 69, 0.3); }
              50% { box-shadow: 0 10px 50px rgba(220, 53, 69, 0.6); }
          }
          .chart-container {
              background: white;
              padding: 25px;
              border-radius: 15px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.15);
              margin-bottom: 20px;
          }
          .chart-container h3 { margin-bottom: 20px; color: #333; }
          .canvas-wrapper { position: relative; height: 300px; }
          .log-container {
              background: white;
              padding: 25px;
              border-radius: 15px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.15);
          }
          .log-container h3 { margin-bottom: 15px; color: #333; }
          .log-list {
              max-height: 200px; overflow-y: auto; background: #f8f9fa;
              padding: 15px; border-radius: 8px;
          }
          .log-item { padding: 8px; border-bottom: 1px solid #e9ecef; font-size: 14px; }
          .log-item:last-child { border-bottom: none; }
          .log-time { color: #999; font-size: 12px; }
          .config-panel {
              background: white;
              padding: 25px;
              border-radius: 15px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.15);
              margin-bottom: 20px;
          }
          .config-panel h3 { margin-bottom: 20px; color: #333; }
          .form-group { margin-bottom: 15px; }
          .form-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
          .form-group input {
              width: 100%; padding: 10px; border: 2px solid #e9ecef; border-radius: 8px;
              font-size: 14px; transition: border-color 0.3s ease;
          }
          .form-group input:focus { outline: none; border-color: #667eea; }
          .no-data-message {
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              background: rgba(255, 255, 255, 0.95);
              border-radius: 10px;
              z-index: 10;
              opacity: 1;
              transition: opacity 0.3s ease;
          }
          .no-data-message.hidden {
              opacity: 0;
              pointer-events: none;
          }
          .no-data-icon {
              font-size: 64px;
              margin-bottom: 15px;
              opacity: 0.5;
          }
          .no-data-text {
              font-size: 24px;
              font-weight: 600;
              color: #666;
              margin-bottom: 10px;
          }
          .no-data-subtext {
              font-size: 14px;
              color: #999;
          }
          @media (max-width: 768px) {
              .data-cards { grid-template-columns: 1fr; }
              .status-bar { flex-direction: column; gap: 15px; }
          }
      </style>
  </head>
  <body>
      <div class="container">
          <div class="header">
              <h1>🌊 STM32+ESP8266 水质检测系统</h1>
              <p style="color: #666;">实时监控水质参数</p>
          </div>

          <div class="status-bar">
              <div class="connection-status">
                  <div class="status-indicator" id="statusIndicator"></div>
                  <span id="statusText">未连接</span>
              </div>
              <div>
                  <button class="btn btn-primary" onclick="toggleConnection()">连接/断开</button>
                  <button class="btn btn-success" onclick="clearLogs()">清空日志</button>
              </div>
          </div>

          <div class="config-panel">
              <h3>⚙️ ESP8266 WebSocket 配置</h3>
              <div class="form-group">
                  <label>ESP8266 IP 地址</label>
                  <input type="text" id="wsUrl" value="ws://192.168.1.100:81" placeholder="ws://192.168.1.100:81">
              </div>
              <div class="form-group">
                  <label>说明</label>
                  <p style="color: #666; font-size: 13px;">
                      ESP8266-01S 默认使用端口 81，请确保 ESP8266 已连接到同一局域网<br>
                      数据格式：{"temperature": 25.5, "ph": 7.2, "turbidity": 2.5}
                  </p>
              </div>
          </div>

          <div class="data-cards">
              <div class="card" id="tempCard">
                  <div class="card-icon">🌡️</div>
                  <div class="card-title">温度</div>
                  <div class="card-value" id="tempValue">--</div>
                  <div class="card-unit">°C</div>
              </div>

              <div class="card" id="phCard">
                  <div class="card-icon">🧪</div>
                  <div class="card-title">pH 值</div>
                  <div class="card-value" id="phValue">--</div>
                  <div class="card-unit">pH</div>
              </div>

              <div class="card" id="turbidityCard">
                  <div class="card-icon">📊</div>
                  <div class="card-title">浊度</div>
                  <div class="card-value" id="turbidityValue">--</div>
                  <div class="card-unit">NTU</div>
              </div>
          </div>

          <div class="chart-container">
              <h3>📈 实时趋势图</h3>
              <div class="canvas-wrapper">
                  <canvas id="dataChart"></canvas>
                  <div class="no-data-message" id="noDataMessage">
                      <div class="no-data-icon">📡</div>
                      <div class="no-data-text">未接入设备</div>
                      <div class="no-data-subtext">请点击"连接"按钮开始接收数据</div>
                  </div>
              </div>
          </div>

          <div class="log-container">
              <h3>📋 系统日志</h3>
              <div class="log-list" id="logList"></div>
          </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <script>
          let ws = null;
          let chart = null;
          let dataHistory = [];
          const maxDataPoints = 50;
          let isConnected = false;

          function initChart() {
              const ctx = document.getElementById('dataChart').getContext('2d');
              chart = new Chart(ctx, {
                  type: 'line',
                  data: {
                      labels: [],
                      datasets: [
                          {
                              label: '温度 (°C)',
                              data: [],
                              borderColor: '#ff6384',
                              backgroundColor: 'rgba(255, 99, 132, 0.1)',
                              tension: 0.4,
                              yAxisID: 'y'
                          },
                          {
                              label: 'pH 值',
                              data: [],
                              borderColor: '#36a2eb',
                              backgroundColor: 'rgba(54, 162, 235, 0.1)',
                              tension: 0.4,
                              yAxisID: 'y1'
                          },
                          {
                              label: '浊度 (NTU)',
                              data: [],
                              borderColor: '#4bc0c0',
                              backgroundColor: 'rgba(75, 192, 192, 0.1)',
                              tension: 0.4,
                              yAxisID: 'y1'
                          }
                      ]
                  },
                  options: {
                      responsive: true,
                      maintainAspectRatio: false,
                      animation: { duration: 0 },
                      scales: {
                          y: {
                              type: 'linear', display: true, position: 'left',
                              min: 0, max: 100,
                              title: { display: true, text: '温度范围' }
                          },
                          y1: {
                              type: 'linear', display: true, position: 'right',
                              min: 0, max: 20,
                              grid: { drawOnChartArea: false },
                              title: { display: true, text: 'pH/浊度范围' }
                          }
                      },
                      plugins: { legend: { position: 'top' } }
                  }
              });
          }

          function addLog(message, type = 'info') {
              const logList = document.getElementById('logList');
              const now = new Date();
              const timeString = now.toLocaleTimeString();
              const logItem = document.createElement('div');
              logItem.className = 'log-item';
              logItem.innerHTML = `<span class="log-time">[${timeString}]</span> ${message}`;
              logList.insertBefore(logItem, logList.firstChild);
              while (logList.children.length > 100) {
                  logList.removeChild(logList.lastChild);
              }
          }

          function clearLogs() {
              document.getElementById('logList').innerHTML = '';
              addLog('日志已清空', 'info');
          }

          function updateStatus(connected) {
              isConnected = connected;
              const indicator = document.getElementById('statusIndicator');
              const statusText = document.getElementById('statusText');

              updateChartVisibility(connected);

              if (connected) {
                  indicator.classList.add('connected');
                  statusText.textContent = '已连接';
                  addLog('成功连接到 ESP8266', 'success');
              } else {
                  indicator.classList.remove('connected');
                  statusText.textContent = '未连接';
                  addLog('已断开连接', 'warning');
                  // 断开连接时清空显示数据
                  document.getElementById('tempValue').textContent = '--';
                  document.getElementById('phValue').textContent = '--';
                  document.getElementById('turbidityValue').textContent = '--';
                  // 移除可能存在的警告样式
                  document.querySelectorAll('.card').forEach(card => {
                      card.classList.remove('alert');
                  });
              }
          }

          function toggleConnection() {
              if (isConnected) disconnect();
              else connect();
          }

          function connect() {
              const wsUrl = document.getElementById('wsUrl').value;
              try {
                  ws = new WebSocket(wsUrl);
                  ws.onopen = function() {
                      updateStatus(true);
                      addLog('WebSocket 连接成功', 'success');
                  };
                  ws.onmessage = function(event) {
                      try {
                          const data = JSON.parse(event.data);
                          updateDisplay(data);
                          updateChart(data);
                          checkThresholds(data);
                      } catch (e) {
                          addLog('收到无效数据：' + e.message, 'error');
                      }
                  };
                  ws.onerror = function(error) {
                      addLog('WebSocket 错误：' + error, 'error');
                  };
                  ws.onclose = function() {
                      updateStatus(false);
                      addLog('连接已关闭', 'warning');
                  };
              } catch (e) {
                  addLog('连接失败：' + e.message, 'error');
              }
          }

          function disconnect() {
              if (ws) {
                  ws.close();
                  ws = null;
              }
              updateStatus(false);
          }

          function updateDisplay(data) {
              if (data.temperature !== undefined) {
                  document.getElementById('tempValue').textContent = data.temperature.toFixed(1);
              }
              if (data.ph !== undefined) {
                  document.getElementById('phValue').textContent = data.ph.toFixed(2);
              }
              if (data.turbidity !== undefined) {
                  document.getElementById('turbidityValue').textContent = data.turbidity.toFixed(1);
              }
          }

          function updateChart(data) {
              const now = new Date().toLocaleTimeString();
              if (dataHistory.length >= maxDataPoints) dataHistory.shift();
              dataHistory.push({
                  time: now,
                  temperature: data.temperature || 0,
                  ph: data.ph || 0,
                  turbidity: data.turbidity || 0
              });
              chart.data.labels = dataHistory.map(d => d.time);
              chart.data.datasets[0].data = dataHistory.map(d => d.temperature);
              chart.data.datasets[1].data = dataHistory.map(d => d.ph);
              chart.data.datasets[2].data = dataHistory.map(d => d.turbidity);
              chart.update('none');
          }

          function checkThresholds(data) {
              const thresholds = {
                  temperature: { min: 0, max: 50, unit: '°C' },
                  ph: { min: 0, max: 14, unit: 'pH' },
                  turbidity: { min: 0, max: 100, unit: 'NTU' }
              };
              for (const [param, threshold] of Object.entries(thresholds)) {
                  const value = data[param];
                  if (value !== undefined && (value < threshold.min || value > threshold.max)) {
                      const card = document.getElementById(param + 'Card');
                      card.classList.add('alert');
                      addLog(`⚠️ ${param} 异常：${value}${threshold.unit}`, 'warning');
                  } else {
                      const card = document.getElementById(param + 'Card');
                      card.classList.remove('alert');
                  }
              }
          }

          function updateChartVisibility(connected) {
              const noDataMessage = document.getElementById('noDataMessage');
              const dataChart = document.getElementById('dataChart');

              if (connected) {
                  noDataMessage.classList.add('hidden');
                  dataChart.style.opacity = '1';
              } else {
                  noDataMessage.classList.remove('hidden');
                  dataChart.style.opacity = '0.3';
              }
          }

          window.addEventListener('DOMContentLoaded', function() {
              initChart();
              addLog('系统启动完成', 'info');
              addLog('点击"连接"按钮开始接收数据', 'info');
              updateChartVisibility(false);
          });
      </script>
  </body>
  </html>
